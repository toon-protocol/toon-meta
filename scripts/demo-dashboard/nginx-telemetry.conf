# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Public demo dashboard — nginx snippet for each devnet connector box.
#
# Add the "dash page" block on the TOON apex box ONLY (it serves the aggregated
# page). Then:
#   docker exec <box>-nginx-1 nginx -t && docker exec <box>-nginx-1 nginx -s reload
# (zero-downtime reload — no container restart).
#
# ── the telemetry block below is RETIRED — do not paste it on a new box ──────
# /admin/metrics.json has returned 502 since the TypeScript connectors were
# stopped on 2026-08-04, and the Rust connector that replaced them has no
# equivalent: ADR 0014 omits per-peer metrics on purpose, and ADR 0008 makes
# the operator surface refuse to start without a bearer token AND write keys,
# so there is no unauthenticated shape to point it at. connector#776 removes
# the block from both devnet boxes; it is kept here only to explain what used
# to be exposed and why the rest of /admin never was.
#
# The dashboard no longer fetches it. It derives node liveness from
# GET /ilp/identity instead — unauthenticated, free, and a stronger claim,
# since it only answers 200 once the connector is serving AND has read its
# signer key. Note that /ilp/identity sends no Access-Control-Allow-Origin,
# so only the box serving the page can be probed for a readable answer; a
# cross-origin node can only be probed for reachability. Adding this page's
# origin to an ACAO header on that location would upgrade the remote node to
# a true "up" — see src/lib/toon.ts.
#
# What the retired block exposed: ONLY /admin/metrics.json, GET. Everything
# else under /admin is refused 404, including the admin API's mutating half.
#
# ── Why only metrics.json (connector#665) ──────────────────────────────────
# This snippet used to list five endpoints — metrics.json, earnings.json,
# routes, peers and channels — and every box that took it served all five to
# the anonymous internet. Four of them carry identifiers that are not
# otherwise public:
#
#   earnings.json  recentClaims[].peerId is `http:0x<counterparty EVM
#                  address>` wherever a client pays that box directly, joined
#                  to the claim's amount and timestamp. That join — an address
#                  to a node's activity — is exactly what someone watching the
#                  settlement contract cannot otherwise make.
#   channels       on-chain channel ids bound to their counterparty.
#   peers          peer topology, and the same `http:0x…` ids for client peers.
#   routes         per-chain settlement addresses, the internal upstream URL
#                  behind each route, and per-route prices.
#
# connector ADR 0008 sanctions none of that: it puts every operator READ behind
# a bearer token and every WRITE behind an RFC 9421 signature, so "readable by
# an operator" was never "readable by the internet".
#
# metrics.json is kept because it is the only one of the five whose body is
# pure aggregate counters (packetsForwarded/Rejected, bytesSent, uptime) keyed
# by CONFIGURED peer names — verified across all three devnet boxes: a paying
# client shows up in earnings.json's claims but never in this endpoint's peer
# list, which mirrors the static peer registry. It is also what the dashboard's
# live flow strip polls, i.e. the thing the page exists to show.
#
# Re-check that property before adding a route whose counterparty is a client
# rather than a configured peer. Do not widen this list to restore the node
# detail modal — that wants an authenticated telemetry path (connector#665).
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── read-only connector telemetry — RETIRED, see banner above (connector#776) ──
location = /admin/metrics.json {
    limit_except GET { deny all; }
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Access-Control-Allow-Origin "https://faucet.devnet.toonprotocol.dev" always;
    add_header Cache-Control "no-store" always;
    set $conn_admin http://connector:8081;
    proxy_pass $conn_admin$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Everything else under /admin is refused rather than proxied. 404 rather than
# 401/403 so the refusal does not advertise that an admin surface exists at
# all. `^~` outranks any regex location and the exact match above outranks
# this, so the one open endpoint stays open and nothing else reaches :8081.
location ^~ /admin { return 404; }

# ── aggregated dashboard page (TOON apex box ONLY) ──
# Build the app (npm run build in scripts/demo-dashboard) and extract dist/* into
# conf.d/dashsite/ (index.html + assets/). The conf.d dir is bind-mounted into
# the nginx container, so the SPA + its /dash/assets/* bundle are served directly.
location = /dash  { return 302 https://$host/dash/; }
location /dash/ {
    alias /etc/nginx/conf.d/dashsite/;
    index index.html;
    try_files $uri $uri/ /dash/index.html;
}
