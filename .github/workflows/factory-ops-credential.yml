# factory-ops credential monitor — the AFK loop's single point of silent failure.
#
# FACTORY_OPS_TOKEN is the identity that applies `agent:implement` (dispatch) and
# submits the review verdict (approval). If it expires, loses repo access, or is
# never shared with a repo, the factory does not error — it simply stops doing
# anything, while every workflow still reports green. That is exactly how the old
# loops' REVIEWER_TOKEN rotted: it expired, reviews silently degraded to a
# COMMENTED verdict, and nobody noticed for weeks.
#
# This job exists to make that failure loud and early. It checks three things:
#
#   1. PRESENT   — the secret reaches this repo at all. Org secrets must be
#                  explicitly shared with PUBLIC repos; an unshared secret is an
#                  empty string at runtime, not an error.
#   2. AUTHORIZED — the token still has write-or-better on every factory repo,
#                  which is what agent-implement.yml's Guard 1 checks. Lose that
#                  and bot-applied labels are refused with no signal.
#   3. FRESH     — the token is not about to expire. Read from GitHub's own
#                  `github-authentication-token-expiration` response header, not
#                  a hardcoded date, so this stays correct across rotations.
#
# Tracked by toon-meta#271.

name: factory-ops credential

on:
  schedule:
    - cron: '23 14 * * 1' # Mondays 14:23 UTC — a weekday, so an alarm is seen
  workflow_dispatch:

permissions:
  contents: read

env:
  # Days of warning before expiry. Long enough to rotate a token without rushing.
  WARN_DAYS: 14

jobs:
  check:
    name: factory-ops credential is present, authorized and fresh
    runs-on: ubuntu-latest
    steps:
      - name: Present — the secret reaches this repo
        env:
          TOKEN: ${{ secrets.FACTORY_OPS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::FACTORY_OPS_TOKEN is empty in this repo."
            echo "Either the org secret does not exist, or it is not shared with"
            echo "this repository. Org secrets must be shared with PUBLIC repos"
            echo "explicitly — an unshared secret is an empty string, not an error."
            echo "Fix: org Settings -> Secrets and variables -> Actions ->"
            echo "FACTORY_OPS_TOKEN -> Repository access."
            exit 1
          fi
          echo "FACTORY_OPS_TOKEN is present (${#TOKEN} chars)."

      - name: Authorized — write-or-better on every factory repo
        env:
          GH_TOKEN: ${{ secrets.FACTORY_OPS_TOKEN }}
        run: |
          set -uo pipefail
          login=$(gh api user --jq '.login' 2>/dev/null || true)
          if [ -z "$login" ]; then
            echo "::error::The token did not authenticate. It may be revoked, expired,"
            echo "or still pending org approval (fine-grained PATs against an org sit"
            echo "unusable until an org owner approves them)."
            exit 1
          fi
          echo "Authenticated as: $login"

          # agent-implement.yml Guard 1 accepts exactly these.
          failed=0
          for repo in relay toon-client rig store connector toon swap toon-meta Forge fractal buzz; do
            perm=$(gh api "repos/toon-protocol/$repo/collaborators/$login/permission" \
              --jq '.permission' 2>/dev/null || echo "none")
            case "$perm" in
              admin|maintain|write) printf '  %-12s %s\n' "$repo" "$perm" ;;
              *)
                printf '  %-12s %s\n' "$repo" "$perm"
                echo "::error::$login lacks write on $repo — agent:implement labels it"
                echo "applies there will be refused by Guard 1, with no error surfaced."
                failed=1 ;;
            esac
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: Actions-write — the token can dispatch fix runners cross-repo
        env:
          GH_TOKEN: ${{ secrets.FACTORY_OPS_TOKEN }}
        run: |
          set -uo pipefail
          # The PR repair pass (toon-meta#357/#384) dispatches agent-fix.yml
          # in the PR's OWN repo via workflow_dispatch — the only start
          # mechanism that works for a CONFLICTING PR (no merge ref means
          # GitHub delivers no pull_request events for it). That call needs
          # the Actions: write repository permission, which this PAT lacked
          # when the path first ran live (403, 2026-08-14) — this check makes
          # a future rotation that forgets the permission loud.
          #
          # ZERO-SIDE-EFFECT PROBE: POST a dispatch with a ref that cannot
          # exist. Authorization is checked before ref resolution, so:
          #   HTTP 422 "No ref found"            = permission PRESENT, and no
          #                                        run is created — pass.
          #   HTTP 403 "Resource not accessible" = permission MISSING — fail.
          failed=0
          for repo in relay store connector toon toon-client rig swap Forge fractal buzz; do
            out=$(gh api -X POST \
              "repos/toon-protocol/$repo/actions/workflows/agent-fix.yml/dispatches" \
              -f ref="__factory-ops-actions-write-probe__" 2>&1 || true)
            case "$out" in
              *"No ref found"*|*"HTTP 422"*)
                echo "  $repo: actions-write OK (422 as expected)" ;;
              *"Resource not accessible"*|*"HTTP 403"*)
                echo "  $repo: MISSING Actions: write"
                echo "::error::FACTORY_OPS_TOKEN cannot dispatch agent-fix.yml in $repo --"
                echo "::error::conflicting-PR repair is dead there until the PAT gains Actions: write."
                failed=1 ;;
              *)
                echo "  $repo: UNEXPECTED: $out"
                echo "::warning::probe against $repo returned neither 422 nor 403 -- inspect." ;;
            esac
          done
          [ "$failed" -eq 0 ] || exit 1

      - name: Fresh — not within the warning window of expiry
        env:
          GH_TOKEN: ${{ secrets.FACTORY_OPS_TOKEN }}
        run: |
          set -uo pipefail
          # GitHub reports a PAT's expiry on every API response. Reading it here
          # rather than hardcoding a date means this check stays correct when the
          # token is rotated, instead of alarming on a stale constant.
          expiry=$(gh api -i user 2>/dev/null \
            | grep -i '^github-authentication-token-expiration:' \
            | cut -d: -f2- | xargs || true)

          if [ -z "$expiry" ]; then
            echo "::warning::No expiry header returned. The credential may be a"
            echo "GitHub App installation token or a PAT set to never expire."
            echo "Presence and authorization both passed, so the loop still works —"
            echo "but nothing here can warn you before it lapses. Record the expiry"
            echo "in FACTORY.md by hand if this token does have one."
            exit 0
          fi

          echo "Token expires: $expiry"
          exp_epoch=$(date -u -d "$expiry" +%s 2>/dev/null || echo 0)
          if [ "$exp_epoch" -eq 0 ]; then
            echo "::warning::Could not parse the expiry header: '$expiry'"
            exit 0
          fi

          now_epoch=$(date -u +%s)
          days=$(( (exp_epoch - now_epoch) / 86400 ))
          echo "Days remaining: $days (warning threshold: $WARN_DAYS)"

          if [ "$days" -lt 0 ]; then
            echo "::error::FACTORY_OPS_TOKEN has EXPIRED. Dispatch and approval are"
            echo "both dead until it is rotated."
            exit 1
          fi
          if [ "$days" -le "$WARN_DAYS" ]; then
            echo "::error::FACTORY_OPS_TOKEN expires in $days day(s). Rotate it now:"
            echo "  1. New fine-grained PAT, resource owner toon-protocol,"
            echo "     Issues + Pull requests read/write, Contents + Metadata read"
            echo "  2. Update the org secret FACTORY_OPS_TOKEN"
            echo "  3. Confirm it is shared with the PUBLIC factory repos"
            echo "  4. Re-run this workflow to confirm"
            exit 1
          fi
          echo "Credential is healthy."
