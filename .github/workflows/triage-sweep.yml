# Factory triage sweep — the MANAGER-TIER cron janitor.
#
# Runs hourly from toon-meta and reaches every factory execution repo (the
# org GitHub App is installed on all of them). It does the two cross-repo jobs
# the event-driven per-repo runners cannot do for themselves:
#   A. add `agent:implement` to workable leaf issues that have gone quiet for
#      the cooldown window (→ fires that repo's agent-implement.yml), and
#   B. file a capped, idempotent remediation issue for stuck agent/ PRs
#      (merge conflict / failing checks / stale), escalating to needs:human
#      once the retry cap is hit.
#
# Full logic + safety model: scripts/factory/triage-sweep.mjs.
#
# ── APPLY vs DRY-RUN ─────────────────────────────────────────────────────────
# The hourly cron only WRITES when the repo variable TRIAGE_APPLY == 'true'.
# Until an admin sets that variable, every cron tick is a no-write report (read
# the job log to see what it WOULD do). Recommended rollout:
#   1. Run once via "Run workflow" with apply=false, eyeball the dry-run list.
#   2. Run once with apply=true to sanity-check a real fan-out.
#   3. Set repo variable TRIAGE_APPLY=true to let the hourly cron go live.
# workflow_dispatch's `apply` input always overrides the variable for that run.
#
# ── TRIAGE_PAT (required for dispatch to actually fire) ──────────────────────
# A label add only triggers agent-implement.yml if the labeler (a) can trigger
# workflows and (b) passes that runner's write-access guard. A GitHub App bot
# fails (b) — it is not a repo collaborator. So the sweep must label as a USER:
# supply org secret TRIAGE_PAT (fine-grained PAT, Issues+PRs write on the
# factory repos). Without it the sweep still reports and can create issues, but
# auto-labelled issues are refused by the guard and no implement run fires.

name: triage-sweep

on:
  schedule:
    - cron: "17 * * * *" # hourly at :17 (off the top-of-hour scheduler congestion)
  workflow_dispatch:
    inputs:
      apply:
        description: "Write changes (label issues / file remediation). false = dry-run report only."
        type: boolean
        default: false
      repos:
        description: "Optional comma-separated repo override (owner/name or bare name). Blank = all factory repos."
        type: string
        default: ""

# One sweep at a time; never let an overrun tick double-act.
concurrency:
  group: triage-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # App token is the fallback identity (can read everything, create issues),
      # but see the header: it does NOT satisfy agent-implement.yml's write-access
      # guard, so dispatch needs TRIAGE_PAT.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }} # org-wide install → all repos

      - name: Run triage sweep
        env:
          # Prefer the user PAT so labelled issues pass the runner's write guard
          # and trigger downstream; fall back to the App token (report-only-safe).
          GH_TOKEN: ${{ secrets.TRIAGE_PAT || steps.app-token.outputs.token }}
          TRIAGE_PAT_PRESENT: ${{ secrets.TRIAGE_PAT != '' }}
          # schedule → obey the TRIAGE_APPLY repo variable (default false/unset);
          # workflow_dispatch → obey the apply input. NB: the second clause is
          # gated on event_name=='schedule' (not a bare `|| vars...`) so a manual
          # dispatch with apply=false does NOT fall through to the repo variable.
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply || (github.event_name == 'schedule' && vars.TRIAGE_APPLY == 'true') }}
          TRIAGE_REPOS: ${{ github.event_name == 'workflow_dispatch' && inputs.repos || '' }}
          TRIAGE_COOLDOWN_MINUTES: "60"
          TRIAGE_STALE_DAYS: "3"
          TRIAGE_STUCK_RETRY_CAP: "2"
        run: npm run triage:sweep
